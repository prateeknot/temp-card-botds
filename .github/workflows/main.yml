name: Free macOS Remote Desktop
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-13
    steps:
    - name: Ngrok Download Aur Install
      run: |
        brew install ngrok

    - name: Mac Me VNC Setup
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

        
        # Remote Screen Sharing Chalu Karne Ka Command
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw MacOSFree123 -restart -agent -privs -all
        
        # Mac Ka Password Set Karna
        sudo dscl . -passwd /Users/runner MacOSFree123

    - name: Tunnel Start Karo
      run: |
        echo "Tunnel shuru ho rahi hai..."
        ngrok tcp 5900 --log=stdout
